name: Daily run

# 07:00 Europe/Amsterdam every day. GitHub cron is UTC-only, so two triggers are scheduled and
# the `gate` job keeps the one that matches the current Amsterdam offset:
#   summer (CEST, +0200): 05:00 UTC   winter (CET, +0100): 06:00 UTC
# Matching on the trigger (not the wall clock) keeps this correct even when GitHub delays a run.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=Europe/Amsterdam date +%z)"
          echo "Amsterdam local time: $(TZ=Europe/Amsterdam date '+%F %H:%M') ($offset)"
          run=false
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 5 * * *" ] && [ "$offset" = "+0200" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 6 * * *" ] && [ "$offset" = "+0100" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  daily:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check out the orphan `data` branch into .data-branch/
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --quiet --depth=1 origin data
            git worktree add --quiet --detach .data-branch FETCH_HEAD
            git -C .data-branch checkout --quiet -B data
          else
            echo "Branch 'data' does not exist yet: creating it locally."
            git worktree add --quiet --detach .data-branch
            git -C .data-branch checkout --quiet --orphan data
            git -C .data-branch rm -rf --quiet . || true
            git -C .data-branch clean -fdxq
          fi

      - name: Restore the database
        run: |
          if [ ! -f .data-branch/radar.db ]; then
            echo "::error::No radar.db on the 'data' branch. Bootstrap it once from your computer with 'make bootstrap-data' (stores your config in the DB and pushes it to the 'data' branch)."
            exit 1
          fi
          mkdir -p data
          cp .data-branch/radar.db data/radar.db

      - name: Install
        run: uv sync --frozen

      # The config (profile, companies, rules) lives in the DB settings table and is read by
      # load_yaml_config, so `radar config pull` is not needed.
      - name: Run the pipeline
        # NO LinkedIn cookies or linkedin-cli here, ever: CI only reads public sources.
        # `radar run` prints counts only; the report is never printed to the log.
        env:
          RADAR_DATABASE_URL: sqlite:///${{ github.workspace }}/data/radar.db
          RADAR_LLM_PROVIDER: ${{ vars.RADAR_LLM_PROVIDER || 'groq' }}
          DRAFT_PROVIDER: ${{ vars.RADAR_DRAFT_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Only export the draft provider when the repo variable is set (empty is invalid).
          if [ -n "$DRAFT_PROVIDER" ]; then export RADAR_DRAFT_PROVIDER="$DRAFT_PROVIDER"; fi
          uv run radar init-db > /dev/null
          uv run radar run

      - name: Commit results to the `data` branch
        if: always()
        run: |
          if [ ! -f data/radar.db ]; then exit 0; fi
          cp data/radar.db .data-branch/radar.db
          if compgen -G "data/reports/*.md" > /dev/null; then
            mkdir -p .data-branch/reports
            cp data/reports/*.md .data-branch/reports/
          fi
          cd .data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f radar.db reports 2>/dev/null || git add -f radar.db
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit --quiet -m "chore(data): daily run $(TZ=Europe/Amsterdam date +%F)"
          git push --quiet origin HEAD:refs/heads/data
          echo "Pushed to data."
