name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste personal data (CV, real postings you applied to, emails, cookies, API keys).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make dev
        2. open /annunci
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [pipeline / connectors, filters, LLM scoring / packs, API, web app, radar send, CI / daily run, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Redact anything personal.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or version
