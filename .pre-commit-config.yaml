# Install once: `uv run pre-commit install` (done by `make install`).
# Run on everything: `uv run pre-commit run --all-files`.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Uses the locally installed binary (`brew install gitleaks`); CI runs gitleaks separately.
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-private
        name: block personal data (paths, emails, phone numbers, private strings)
        entry: python3 scripts/check_private.py
        language: system
        pass_filenames: true
