[project]
name = "speculor"
version = "0.1.0"
description = "Radar: an internship-hunting agent with a human in the loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Local pre-ranking by embedding similarity (torch + a small multilingual model, ~0.5 GB).
# Not installed in CI; without it the pipeline keeps its previous ordering.
embed = ["sentence-transformers>=3.0"]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["radar"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "sentence_transformers.*"]
ignore_missing_imports = true
