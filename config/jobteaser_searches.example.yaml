# JobTeaser (Luiss career service): EXAMPLE. Copy to config/jobteaser_searches.yaml (gitignored)
# and adjust. Read by radar.connectors.jobteaser (source "jobteaser", only on your Mac with the
# browser profile made by `make jobteaser-login`) and by the Oggi screen's weekly reminder.
#
# Radar never opens JobTeaser listing or search pages (robots.txt disallows them). You open
# them yourself in Chrome and click "Salva in Radar" (extension/jobteaser, see docs/RUNNING.md);
# the connector then opens only the single offer pages still missing a description (allowed by
# robots.txt), one at a time, a fixed 5 s apart, at most `max_details` per day.

base_url: https://luiss.jobteaser.com
locale: it
max_details: 40     # offer pages opened per day, at most
enrich_alerts: true # also open offers known only from JobTeaser alert emails / the seed

# Direct links shown on the Oggi screen every Monday (and when the last pass is older than
# 7 days). Open each one, let the page load, click "Salva in Radar". Only https JobTeaser URLs
# are shown; {base} and {locale} are replaced. Copy the real URLs from your browser after
# choosing the filter ("Offerte mirate", "Offerte dei partner") or opening a saved search.
links:
  offerte_mirate: "{base}/{locale}/job-offers"     # TO REPLACE with the filtered URL
  offerte_partner: "{base}/{locale}/job-offers"    # TO REPLACE with the filtered URL
  saved_searches:
    - {name: "Data scientist", url: "{base}/{locale}/job-offers?q=data+scientist"}
    - {name: "Consulting", url: "{base}/{locale}/job-offers?q=consulting"}
