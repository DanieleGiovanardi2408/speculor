# Radar companies config: EXAMPLE with fictional companies (the real one is config/companies.yaml,
# gitignored). Read by radar.connectors.registry.build_connectors().

# Optional. Case-insensitive word-prefix match on ATS posting titles ("intern" also matches
# "Internship"). Postings whose title matches none of these are dropped by ATS connectors.
# SmartRecruiters always uses a prefilter (this list, or a built-in default) because it needs one
# request per posting to read the description.
title_filter: [intern, internship, stage, stagiaire, tirocinio, graduate, junior, trainee, thesis,
               werkstudent, working student, entry level, new grad, apprentice, analyst]

companies:
  # ats: greenhouse | lever | ashby | smartrecruiters | workday | personio | workable |
  #      teamtailor | recruitee | inrecruiting | none
  # sector (optional, stored on the company): fintech | vc | consulting | real_estate | ai |
  #      banking_insurance | big_tech | ... (free text)
  # slug: the board id in the ATS URL
  #   greenhouse      job-boards(.eu).greenhouse.io/<slug>/jobs/123    -> slug
  #   lever           jobs(.eu).lever.co/<slug>/<uuid>                  -> slug (+ region: eu for .eu)
  #   ashby           jobs.ashbyhq.com/<slug>/<uuid>                    -> slug
  #   smartrecruiters jobs.smartrecruiters.com/<CompanyId>/<id>-title   -> CompanyId (case matters)
  #   workday         <tenant>.<wdN>.myworkdayjobs.com/[en-US/]<site>   -> "<tenant>|<wdN>|<site>"
  #   personio        <slug>.jobs.personio.de/job/123                   -> slug (+ region: com for
  #                   .jobs.personio.com; optional lang: en)
  #   workable        apply.workable.com/<slug>/                        -> slug
  #   teamtailor      <slug>.teamtailor.com/jobs                        -> slug (or the custom
  #                   careers host, e.g. careers.example.com, when it serves /jobs.rss)
  #   recruitee       <slug>.recruitee.com/o/<offer>                    -> slug
  #   inrecruiting    the careers page embeds <host>.intervieweb.it/annunci.php?d=<d>&k=<k>
  #                   -> "<host>|<d>|<k>" (k is the public site key; optional lang: it|en)
  # region: "eu" for EU-hosted boards (Lever: switches to api.eu.lever.co; Greenhouse: informational)
  # active: false skips the entry; seed: true means it came from the seed export
  - name: Nebula Analytics
    ats: greenhouse
    slug: nebulaanalytics
    region: null
    active: true
    seed: false
  - name: Fiordo Payments
    ats: lever
    slug: fiordo
    region: eu
    active: true
    seed: false
    sector: fintech
  - name: Lumen Labs AI
    ats: ashby
    slug: lumenlabs
    region: null
    active: true
    seed: false
    title_filter: false        # per-company override: false = no title filter, or give a list
  - name: Orbis Consulting
    ats: smartrecruiters
    slug: OrbisConsulting
    region: null
    active: true
    seed: false
  - name: Gruppo Meridiana
    ats: workday
    slug: "meridiana|wd3|Meridiana_Careers"   # or tenant: meridiana, host: wd3, site: Meridiana_Careers
    region: null
    active: true
    seed: false
    # optional, Workday only:
    search_terms: [intern, internship, graduate, stage, tirocinio, junior]  # default list
    countries: europe          # or [Italy, Netherlands]: scope via the board's country facet
    # applied_facets: {locations: [<facet id>, ...]}   # raw facets, for city-only tenants
    max_details: 40            # description requests per run
  - name: Nordlys Ventures
    ats: personio
    slug: nordlys
    region: com                # nordlys.jobs.personio.com
    lang: en
    active: true
    seed: false
    sector: vc
  - name: Atlante Immobili
    ats: workable
    slug: atlante-immobili
    region: null
    active: true
    seed: false
    sector: real_estate
  - name: Kestrel AI
    ats: teamtailor
    slug: kestrel              # or a custom careers host serving /jobs.rss
    region: null
    active: true
    seed: false
    sector: ai
  - name: Polder Advisory
    ats: recruitee
    slug: polderadvisory
    region: null
    active: true
    seed: false
    sector: consulting
  - name: Banca Esempio Digitale
    ats: inrecruiting
    slug: "bancaesempio|bancaesempio.example|publicsitekey"   # host|d|k from the careers page
    region: null
    active: true
    seed: false
    sector: banking_insurance
  - name: Banca Esempio
    ats: none                  # no supported public ATS: tracked manually / via LinkedIn
    slug: null
    region: null
    active: true
    seed: true
    unresolved: custom careers portal   # informational only
  - name: Vecchia Startup
    ats: ashby
    slug: vecchiastartup
    region: null
    active: false              # skipped
    seed: false

# LinkedIn public guest search. NOTE: linkedin.com/robots.txt disallows all paths for
# non-whitelisted user agents, so this connector reports an error instead of fetching
# (see docs/SOURCES.md). Kept here so it works if access is ever granted.
linkedin:
  enabled: true
  max_details: 5               # description fetches per run
  queries:                     # one page (up to 10 cards) per query, last 7 days
    - {keywords: "AI engineer intern", location: "Italy"}
    - {keywords: "data scientist intern", location: "Netherlands"}
